[workspace]
resolver = "2"
members = ["crates/topcoat", "crates/topcoat-db", "crates/topcoat-render"]

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
diesel = { version = "2.2", features = ["sqlite", "chrono"] }
diesel_migrations = "2.2"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
# NOTE: issue #30 では Askama 0.12系を想定していたが、crates.io 上の 0.12 系は既に
# 深いバージョン (2026-08 時点の最新安定版は 0.16) に置き換わっており 0.12 は入手できない。
# `#[derive(Template)]` + `#[template(path = "...")]` + `.render()` という中核 API は
# 0.12→0.16 間で変わっていないため、利用可能な最新安定版を採用する。
askama = "0.16"
# NOTE: crates.io 上の `slug` crate に 1.0 系は存在せず (2026-08 時点の最新安定版は 0.1.6)、
# 0.1 系が唯一のメジャーライン。issue 側の想定（1.0系）とは異なるが、利用可能な最新安定版として採用する。
slug = "0.1"
tempfile = "3"
tera = "1"
topcoat-db = { path = "crates/topcoat-db" }
resvg = { version = "0.44", default-features = false, features = ["text"] }
usvg = { version = "0.44", default-features = false, features = ["text", "fontdb"] }
tiny-skia = "0.11"
topcoat-render = { path = "crates/topcoat-render" }
